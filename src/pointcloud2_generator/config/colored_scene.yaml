# colored_scene.yaml
#
# Demonstrates the new point_type / custom intensity field / per-shape
# color+intensity features. Uses xyzrgbi with a custom field name
# "reflectivity" instead of the usual "intensity".

frame_id: map
point_type: xyzrgbi
intensity_field_name: reflectivity

shapes:
  - type: sphere
    num_points: 2000
    center: [3.0, 0.0, 0.0]
    radius: 0.6
    color: [255, 0, 0]        # red
    intensity: 0.9

  - type: cuboid
    num_points: 2000
    center: [0.0, 3.0, 0.0]
    size_x: 1.0
    size_y: 1.0
    size_z: 1.0
    color: [0, 255, 0]        # green
    intensity: 0.5

  - type: cylinder
    num_points: 2000
    center: [-3.0, 0.0, 0.0]
    radius: 0.5
    height: 1.5
    color: [0, 0, 255]        # blue
    intensity: 0.2
